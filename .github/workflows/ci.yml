name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # versão lida do campo "packageManager" do package.json (pnpm@11.2.2)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:run

      - name: Build
        run: pnpm build
        env:
          # Build precisa das envs públicas; valores dummy de CI (não são segredos reais)
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci-dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: Playwright E2E (375 / 768 / 1440)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # versão lida do campo "packageManager" do package.json (pnpm@11.2.2)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Check for E2E specs
        id: specs
        run: |
          if ls tests/e2e/*.spec.ts >/dev/null 2>&1; then
            echo "has_specs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_specs=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum spec E2E ainda (tests/e2e/ vazio) — pulando. Specs entram na Tarefa 1.3."
          fi

      - name: Install Playwright browsers
        if: steps.specs.outputs.has_specs == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E (3 breakpoints)
        if: steps.specs.outputs.has_specs == 'true'
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci-dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          # ⚠️ E2E que dependem de banco/auth real precisam de secrets do GitHub
          # (DATABASE_URL de teste, Clerk test keys). Configurar em Settings > Secrets.
          # Enquanto não houver, manter os specs e2e em telas públicas (sem login/db).

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.specs.outputs.has_specs == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
