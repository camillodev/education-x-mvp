# pnpm v11: aprova os build scripts das deps nativas.
# Sem isto, o CI (pnpm fresco, sem store aprovado) sai com ERR_PNPM_IGNORED_BUILDS.
# À prova de versão: incluímos as DUAS chaves — `allowBuilds` (v11.4+) e
# `onlyBuiltDependencies` (v11.0–11.3). O pnpm ignora a chave que não conhecer.
allowBuilds:
  "@clerk/shared": true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@clerk/shared"
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
